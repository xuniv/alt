# poll: find tags in the private source repositories that have no release yet and dispatch build.yml
# for them. It is the backstop for tags that no pre-push hook announced (pushed from another machine
# or created on GitHub); the hook stays the fast path.
#
# Trigger
#   workflow_dispatch, inputs:
#     app      bundle identifier (optional); empty checks every app whose app.json enables privateBuild
#     dry_run  boolean, default false; count the candidates without dispatching builds
#     loop     boolean, default false; keep polling: the run ends with the job "next", which waits for
#              the wait timer of the environment alt-poll-timer (no runner is held meanwhile; set by
#              bin/alt poller, default 15 minutes) and then dispatches poll.yml with loop=true again.
#              Run title "poll loop". GitHub starts scheduled runs of this repository hours late, so
#              the loop replaces a schedule; poll-watch.yml restarts it when it stopped.
#   next refuses to dispatch when a newer loop run is active (two loops become one), and when this run
#   started less than 5 minutes ago (the wait timer is missing); it tries the dispatch three times.
#   Cancelling a loop run stops the loop until poll-watch.yml, bin/alt poller or bin/alt build starts it
#   again; to stop it for good, also disable poll-watch.yml and delete the environment alt-poll-timer.
#
# Only registered apps are polled: apps/<bid>/app.json enables privateBuild, and the app's environment
# holds the repository and a read-only deploy key for that repository alone (bin/alt register). The
# workflow has no other access to private repositories.
#
# Per app (environment alt-<ALIAS>: secret ALT_APP names the repository, ALT_KEY holds its deploy key;
# each check job references only its own app's environment, so it receives no other app's secrets):
#   tags come from git ls-remote over SSH with the pinned host keys in .github/known_hosts, and versions
#   from privateBuild.tagPattern (default ^v<semver>$). Versions below privateBuild.minVersion are never
#   built by this workflow (bin/alt build and the hook may still build them). A version is a candidate
#   when the token sees no
#   release <bid>-v<version> (drafts are not listed for a read-only token) and no build.yml run titled
#   "build <bid> <tag>" was created in the last 30 days, whatever its state, and the version is not
#   listed in apps/<bid>/retracted.json (a withdrawn version; a file that cannot be read fails the job
#   before anything is dispatched, and build.yml refuses a withdrawn version as well, since poll never
#   sets its force input) nor has a record apps/<bid>/versions/<version>.json (a withdrawal that sync
#   has not committed yet). At most two builds per app are dispatched, newest version first, after a
#   60 second pause and a second look at the run titles, so a build that a pre-push hook started at
#   the same moment is not started twice. Job names carry no matrix values and the log shows counts
#   only.
#   The run title is public as soon as a build is dispatched, so a tag that build.yml would refuse as
#   its ref, or whose run title holds a denylist term or a home path (repository secret ALT_DENYLIST,
#   required), is never dispatched; it is only counted as refused.
name: poll
run-name: ${{ inputs.loop && 'poll loop' || 'poll' }}

on:
  workflow_dispatch:
    inputs:
      app:
        description: Bundle identifier (empty for every enabled app)
        type: string
        required: false
        default: ""
      dry_run:
        description: Count candidates without dispatching builds
        type: boolean
        default: false
      loop:
        description: Start the next run after the wait timer of environment alt-poll-timer
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      # [{"bid": ..., "alias": ...}]: public bundle identifiers; this job holds no secret that could mask them
      apps: ${{ steps.apps.outputs.apps }}
      count: ${{ steps.apps.outputs.count }}
    steps:
      - name: Validate inputs
        env:
          APP: ${{ inputs.app }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          export LC_ALL=C
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::poll only runs on main"
            exit 1
          fi
          bid_re='^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$'
          if [ -n "$APP" ]; then
            if [ "${#APP}" -gt 155 ] || [[ ! "$APP" =~ $bid_re ]] || [[ "$APP" =~ -v[0-9] ]]; then
              echo "::error::app must be a bundle identifier"
              exit 1
            fi
          fi
          if [[ ! "$DRY_RUN" =~ ^(true|false)$ ]]; then
            echo "::error::dry_run must be true or false"
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List apps
        id: apps
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
          APP: ${{ inputs.app }}
        run: |
          python3 - <<'PY'
          import glob, json, os, re, sys
          from altsource.stage import Toolkit
          want = os.environ.get("APP") or ""
          bids = []
          for path in sorted(glob.glob(os.path.join("apps", "*", "app.json"))):
              bid = os.path.basename(os.path.dirname(path))
              if not re.fullmatch(r"[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?", bid) or re.search(r"-v\d", bid):
                  continue
              if want and bid != want:
                  continue
              try:
                  with open(path, encoding="utf-8") as fh:
                      app = json.load(fh)
              except (OSError, ValueError):
                  continue
              private = app.get("privateBuild") if isinstance(app, dict) else None
              if isinstance(private, dict) and private.get("enabled") is True:
                  bids.append(bid)
          if want and not bids:
              print("::error::the app does not enable privateBuild")
              sys.exit(1)
          apps = []
          for bid in bids:
              alias = Toolkit().alias_for(bid)
              if not re.fullmatch(r"[A-Z0-9_]{1,200}", alias):
                  print("::error::no secret alias for an app")
                  sys.exit(1)
              apps.append({"bid": bid, "alias": alias})
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("apps=%s\ncount=%d\n" % (json.dumps(apps, separators=(",", ":")), len(apps)))
          print("apps: %d" % len(apps))
          PY

  check:
    needs: list
    if: needs.list.outputs.count != '0'
    name: check ${{ strategy.job-index }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        app: ${{ fromJSON(needs.list.outputs.apps) }}
    # one check per app at a time, so two runs never both decide to build the same tag
    concurrency:
      group: alt-poll-${{ matrix.app.alias }}
      cancel-in-progress: false
      queue: max
    environment:
      name: alt-${{ matrix.app.alias }}
      deployment: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the app
        env:
          BID: ${{ matrix.app.bid }}
        run: |
          export LC_ALL=C
          bid_re='^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$'
          if [ "${#BID}" -gt 155 ] || [[ ! "$BID" =~ $bid_re ]] || [[ "$BID" =~ -v[0-9] ]]; then
            echo "::error::not a bundle identifier"
            exit 1
          fi

      - name: Find new versions
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
          GH_TOKEN: ${{ github.token }}
          ALT_REPO: ${{ github.repository }}
          BID: ${{ matrix.app.bid }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          ALT_DENYLIST: ${{ secrets.ALT_DENYLIST }}
          ALT_APP_CONFIG: ${{ secrets.ALT_APP }}
          ALT_DEPLOY_KEY: ${{ secrets.ALT_KEY }}
        run: |
          export LC_ALL=C
          python3 - "$RUNNER_TEMP/alt-repo" <<'PY'
          import json, os, re, sys
          raw = os.environ.get("ALT_APP_CONFIG") or ""
          try:
              config = json.loads(raw) if raw else None
          except ValueError:
              config = None
          repo = config.get("repo") if isinstance(config, dict) else None
          if not isinstance(repo, str) or not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
              print("::error::secret ALT_APP of environment alt-<ALIAS> is missing or has no repo")
              sys.exit(1)
          print("::add-mask::" + repo)
          with open(sys.argv[1], "w", encoding="utf-8") as fh:
              fh.write(repo)
          PY
          if [ -z "$ALT_DEPLOY_KEY" ]; then
            echo "::error::secret ALT_KEY of environment alt-<ALIAS> is missing"
            exit 1
          fi
          repo=$(cat "$RUNNER_TEMP/alt-repo")
          ssh_dir="$RUNNER_TEMP/alt-ssh"
          rm -rf "$ssh_dir"
          trap 'rm -rf "$ssh_dir"' EXIT
          (umask 077 && mkdir "$ssh_dir" && printf '%s\n' "$ALT_DEPLOY_KEY" > "$ssh_dir/key")
          export GIT_SSH_COMMAND="ssh -F /dev/null -i '$ssh_dir/key' -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$GITHUB_WORKSPACE/.github/known_hosts' -o GlobalKnownHostsFile=/dev/null"
          export GIT_TERMINAL_PROMPT=0
          if ! git ls-remote --tags --refs "git@github.com:$repo.git" >"$RUNNER_TEMP/tags.txt" 2>/dev/null; then
            echo "::error::the tags of the private repository could not be listed"
            exit 1
          fi
          rm -rf "$ssh_dir"
          python3 - "$RUNNER_TEMP/tags.txt" <<'PY'
          import datetime, json, os, re, sys, time
          from altsource.cli import DEFAULT_TAG_PATTERN, SEMVER_PATTERN
          from altsource.gh import GhError, GitHub
          from altsource.leaks import GateError, load_denylist, scan_text
          from altsource.retract import RetractError, load as load_withdrawn
          from altsource.stage import Toolkit, parse_semver

          MAX_PER_APP = 2
          SETTLE_SECONDS = int(os.environ.get("ALT_POLL_SETTLE_SECONDS") or 60)
          # the rules of build.yml's ref input
          REF_RE = re.compile(r"[A-Za-z0-9][A-Za-z0-9._/-]{0,127}")
          deps = Toolkit()
          bid = os.environ["BID"]
          dry_run = os.environ.get("DRY_RUN") == "true"
          try:
              denylist = load_denylist()
          except GateError:
              print("::error::secret ALT_DENYLIST is missing or empty")
              sys.exit(1)


          def refused(name):
              if (not REF_RE.fullmatch(name) or ".." in name or "//" in name or "/." in name
                      or name.endswith(("/", ".", ".lock"))):
                  return True
              return bool(scan_text("build %s %s" % (bid, name), denylist))


          try:
              with open(os.path.join("apps", bid, "app.json"), encoding="utf-8") as fh:
                  private = json.load(fh).get("privateBuild") or {}
              pattern = re.compile(private.get("tagPattern") or DEFAULT_TAG_PATTERN)
          except (OSError, ValueError, AttributeError, TypeError, re.error):
              private, pattern = {}, None
          if pattern is None or "version" not in pattern.groupindex:
              print("::error::privateBuild.tagPattern is not usable")
              sys.exit(1)
          try:
              floor = parse_semver(deps, private["minVersion"]) if "minVersion" in private else None
          except (TypeError, ValueError):
              print("::error::privateBuild.minVersion is not a semver")
              sys.exit(1)
          try:
              withdrawn = load_withdrawn(".", bid)  # a missing file lists nothing
          except RetractError:
              print("::error::apps/<app>/retracted.json could not be checked")
              sys.exit(1)

          versions = {}
          older = set()
          refusals = set()
          with open(sys.argv[1], encoding="utf-8", errors="replace") as fh:
              for line in fh:
                  ref = line.rstrip("\n").partition("\t")[2]
                  if not ref.startswith("refs/tags/"):
                      continue
                  name = ref[len("refs/tags/"):]
                  match = pattern.fullmatch(name)
                  version = match.group("version") if match else None
                  if not version or not re.fullmatch(SEMVER_PATTERN, version):
                      continue
                  try:
                      tag = deps.make_tag(bid, version)
                  except Exception:
                      continue
                  if floor is not None and parse_semver(deps, version) < floor:
                      older.add(version)
                      continue
                  if refused(name):
                      refusals.add(name)
                      continue
                  versions.setdefault(version, (name, tag))

          def build_titles(gh):
              since = (datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=30)).strftime("%Y-%m-%d")
              runs = gh.api("GET", "repos/%s/actions/workflows/build.yml/runs" % gh.repo,
                            fields={"created": ">=" + since}, paginate=True)
              return {r.get("display_title") for r in runs if isinstance(r, dict)}


          def withdrawing(version):
              # a version record without a published release: sync has not yet committed a withdrawal
              # (or a takedown); the commit that drops the record adds the tombstone
              return os.path.exists(os.path.join("apps", bid, "versions", version + ".json"))


          late = []
          try:
              gh = GitHub()
              released = {r.get("tag_name") for r in gh.list_releases()}
              titles = build_titles(gh)
              candidates = [v for v, (name, tag) in versions.items()
                            if tag not in released and "build %s %s" % (bid, name) not in titles]
              skipped = [v for v in candidates if v in withdrawn or withdrawing(v)]
              candidates = [v for v in candidates if v not in skipped]
              candidates.sort(key=lambda v: parse_semver(deps, v), reverse=True)
              chosen = candidates[:MAX_PER_APP]
              if chosen and not dry_run:
                  # a pre-push hook may have started the same tag a moment ago, and its run is listed only
                  # a few seconds later: look again before starting a second build
                  time.sleep(SETTLE_SECONDS)
                  titles = build_titles(gh)
                  late = [v for v in chosen if "build %s %s" % (bid, versions[v][0]) in titles]
                  chosen = [v for v in chosen if v not in late]
                  for version in chosen:
                      gh.dispatch_workflow("build.yml", "main",
                                           {"app": bid, "ref": versions[version][0], "publish": "true"})
          except GhError as exc:
              print("::error::" + str(exc))
              sys.exit(1)
          print("matching tags: %d, below minVersion: %d, refused: %d, withdrawn: %d, candidates: %d, "
                "started meanwhile: %d, %s: %d" % (
                    len(versions), len(older), len(refusals), len(skipped), len(candidates), len(late),
                    "would dispatch" if dry_run else "dispatched", len(chosen)))
          PY

  next:
    needs: [list, check]
    # whatever this run found; a cancelled run stops the loop
    if: ${{ !cancelled() && inputs.loop }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    environment:
      name: alt-poll-timer
      deployment: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the next run
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
          GH_TOKEN: ${{ github.token }}
          ALT_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::the poll loop only runs on main"
            exit 1
          fi
          python3 - <<'PY'
          import datetime, os, sys, time
          from altsource.gh import GhError, GitHub

          LOOP_TITLE = "poll loop"
          MIN_MINUTES = 5
          me = int(os.environ["RUN_ID"])
          try:
              gh = GitHub()
              run = gh.api("GET", "repos/%s/actions/runs/%d" % (gh.repo, me))
              started = datetime.datetime.strptime(run["created_at"], "%Y-%m-%dT%H:%M:%SZ").replace(
                  tzinfo=datetime.timezone.utc)
              age = datetime.datetime.now(datetime.timezone.utc) - started
              if age < datetime.timedelta(minutes=MIN_MINUTES):
                  print("::error::this run started %d s ago: the environment alt-poll-timer needs a wait timer "
                        "of at least %d minutes (bin/alt poller); the loop stops here"
                        % (age.total_seconds(), MIN_MINUTES))
                  sys.exit(1)
              listed = gh.api("GET", "repos/%s/actions/workflows/poll.yml/runs" % gh.repo, fields={"per_page": 30})
              runs = listed.get("workflow_runs") if isinstance(listed, dict) else None
              if not isinstance(runs, list):
                  raise GhError("unexpected run listing")
              newer = [r for r in runs if isinstance(r, dict) and isinstance(r.get("id"), int) and r["id"] > me
                       and r.get("display_title") == LOOP_TITLE and r.get("status") != "completed"]
              if newer:
                  print("a newer poll loop run is active; this loop ends here")
                  sys.exit(0)
              for attempt in range(3):  # a POST is not retried by the client; one failure would end the loop
                  try:
                      gh.dispatch_workflow("poll.yml", "main", {"loop": "true"})
                      break
                  except GhError:
                      if attempt == 2:
                          raise
                      time.sleep(int(os.environ.get("ALT_RETRY_SECONDS") or 20) * (attempt + 1))
          except (GhError, KeyError, TypeError, ValueError) as exc:
              print("::error::the next poll could not be started: %s" % exc)
              sys.exit(1)
          print("next poll started")
          PY
